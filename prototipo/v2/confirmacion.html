<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmación · Pagos académicos · v2</title>
<link rel="stylesheet" href="styles.css">
<style>
  .conf{max-width:520px;margin:32px auto;padding:24px;border:1px solid #ccc;border-radius:10px;background:#fff;font-family:Arial,sans-serif}
  .ok{font-size:40px;text-align:center}
  .conf h1{text-align:center;font-size:24px;margin:8px 0 18px}
  .conf h1:focus{outline:3px solid #1a56db;outline-offset:4px}
  dl{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:0 0 16px}
  dt{color:#555} dd{margin:0;text-align:right;font-weight:bold}
  .total{border-top:2px solid #333;padding-top:8px}
  .aviso{padding:12px;border-radius:6px;margin-bottom:14px}
  .aviso.error{background:#fdecea;border:2px solid #c0392b}
  .acciones{display:flex;gap:12px;flex-wrap:wrap}
  .acciones button,.acciones a{padding:12px 18px;border-radius:6px;font-size:16px;cursor:pointer;text-decoration:none}
  .primario{background:#1a56db;color:#fff;border:0}
  .secundario{background:#fff;color:#1a56db;border:2px solid #1a56db}
  .acciones button:focus-visible,.acciones a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
  .ayuda{font-size:13px;color:#666;margin-top:14px}
</style>
</head>
<body>
<main class="conf" aria-labelledby="titulo">
  <div class="ok" aria-hidden="true">✓</div>
  <ol class="pasos" aria-label="Pasos del pago"><li>1. Revisar</li><li>2. Pagar</li><li aria-current="step">3. Comprobante</li></ol>
  <p class="entidad" id="entidad"></p>
  <h1 id="titulo" tabindex="-1">Pago realizado</h1>
  <div id="aviso" role="alert" hidden></div>
  <dl id="detalle"></dl>
  <div class="acciones">
    <button type="button" class="primario" id="descargar">Descargar comprobante</button>
    <a class="secundario" id="volver" href="inicio.html">Volver al inicio</a>
  </div>
  <p class="ayuda">Teclado: <b>Tab</b> recorre los botones · <b>Enter</b> activa · <b>Esc</b> vuelve al inicio.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const caso = q.get('caso') === '04' ? '04' : '03';
  const pagos = q.get('pagos') === '2' ? 2 : 1;   // v1 IHC-04: pago.html envía pagos=2 si hubo doble clic
  const hoy = new Date().toLocaleDateString('es-EC');
  const num = 'PA-2026-' + (caso === '03' ? '0412' : '0530');

  const datos = caso === '03'
    ? [['N.º de comprobante', num], ['Fecha', hoy], ['Concepto', 'Matrícula + seguro'],
       ['Subtotal', '$90.00'], ['Comisión (anunciada en Inicio)', '$2.50'], ['Total pagado = total aceptado', '$92.50']]
    : [['N.º de comprobante', num], ['Fecha', hoy], ['Estudiante', 'Ana Torres'],
       ['Concepto', 'Pensión de octubre'], ['Método', 'Tarjeta •••• 4821'],
       ['Total pagado', pagos === 2 ? '$120.00 (2 cobros)' : '$60.00']];

  const dl = document.getElementById('detalle');
  datos.forEach(([k, v], i) => {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    if (i === datos.length - 1) { dt.className = 'total'; dd.className = 'total'; }
    dl.append(dt, dd);
  });

  if (caso === '04' && pagos === 2) {      // fallo adicional visible en v1
    const a = document.getElementById('aviso');
    a.className = 'aviso error'; a.hidden = false;
    a.textContent = 'Se registraron 2 pagos de $60.00.';
  }

  const inicio = 'inicio.html?caso=' + caso;
  document.getElementById('volver').href = inicio;
  document.getElementById('descargar').addEventListener('click', () => {
    const t = datos.map(([k, v]) => k + ': ' + v).join('\n');
    const url = URL.createObjectURL(new Blob(['Comprobante de pago\n\n' + t], {type: 'text/plain'}));
    const l = document.createElement('a'); l.href = url; l.download = num + '.txt'; l.click();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') location.href = inicio; });

  // Foco inicial en el título: el lector de pantalla y el teclado empiezan en el resultado
  document.getElementById('titulo').focus();
</script>
<script>
(function(){var c=new URLSearchParams(location.search).get('caso')==='04'?'04':'03';
document.getElementById('entidad').innerHTML=c==='04'
 ? 'Paga: <b>usted, como representante</b> · Por: <b>Ana Torres</b> · A: <b>Universidad Técnica de Ambato</b>'
 : 'Paga: <b>usted (estudiante)</b> · A: <b>Universidad Técnica de Ambato</b> · Concepto: matrícula';})();
</script>
</body>
</html>
